/* Layout: cabeçalho fixo com abas; área de trabalho em tabelas densas; formulários em folha modal */
:root{

}
@media (prefers-color-scheme: dark){

    --accent:#8d98ff; --accent-ink:#ffffff; --accent-soft:#2b3150; --accent-hover:#a0a9ff;
    --teal:#36c4bb; --teal-soft:#173d42; --violet:#9b8cff; --violet-soft:#342e57;
    --ok:#62d09b; --ok-soft:#173326; --warn:#f0c15e; --warn-soft:#3a2d10; --bad:#ff8d84; --bad-soft:#40201e;
    --shadow:0 12px 40px rgba(3,6,17,.38); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151827; --surface:#1e2335; --surface-2:#292f45; --ink:#f2f4fb; --muted:#a8b1c7; --line:#343c53; --line-soft:#2a3043;
  --accent:#8d98ff; --accent-ink:#ffffff; --accent-soft:#2b3150; --accent-hover:#a0a9ff;

}
*{box-sizing:border-box}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}

.fld{display:flex;flex-direction:column;gap:3px;min-width:0}

input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
.input-like{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:34px;font-variant-numeric:tabular-nums}

.dashboard-welcome h2{font-size:25px;margin:0 0 3px}
.dashboard-welcome{margin-bottom:2px}
.dashboard-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.shortcut-legend{display:flex;align-items:stretch;gap:0}

.shortcut-item+.shortcut-item{border-left:1px solid var(--line)}
.shortcut-key{display:inline-block;padding:3px 8px;margin-bottom:3px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface);color:var(--ink);font:600 11px/1.2 var(--f-body)}

@media(max-width:760px){.dashboard-heading{align-items:flex-start;flex-direction:column;gap:10px}.shortcut-legend{max-width:100%;overflow-x:auto}.shortcut-item:first-child{padding-left:0}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card>h3{font-size:16px;padding:14px 16px 7px}
.card ul{list-style:none;margin:0;padding:0}
.card li{display:flex;justify-content:space-between;gap:14px;padding:10px 16px;border-top:1px solid var(--line-soft)}
.card li .a{min-width:0}
.card li .a b{font-weight:600;display:block;overflow-wrap:anywhere}
.card .vv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:6px;margin:8px 0 0;padding-left:18px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.hero h2{font-size:20px;margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 12px 20px;overflow-y:auto}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:880px}
.sheet.sale{max-width:1120px}
.sheet.sm{max-width:480px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sh-h{cursor:grab;user-select:none}
.sh-h:active{cursor:grabbing}
.sh-h h2{font-size:18px}
.sh-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sh-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.sheet.dragged{max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.sheet.dragged .sh-b{overflow-y:auto;min-height:0}
.sheet.dragged .sh-h,.sheet.dragged .sh-f{flex:0 0 auto}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:2px 8px;border-radius:6px}
.x:hover{background:var(--line-soft);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grid.fee-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.fee-total{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;grid-template-columns:1fr 1fr}
.fee-total>div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.fee-total .grand{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;font-size:15px;font-weight:700}
@media(max-width:520px){.grid.fee-grid{grid-template-columns:1fr}}
.grid .w2{grid-column:span 2}
.grid .full{grid-column:1/-1}
@media (max-width:480px){.grid .w2{grid-column:auto}}
.irow{display:grid;grid-template-columns:minmax(0,3fr) 84px 112px 112px 34px;gap:8px;align-items:end;padding:8px 0;border-top:1px dashed var(--line)}
.irow.venda{grid-template-columns:minmax(220px,3fr) 62px 92px 95px 110px 90px 118px 28px}
.irow:first-child{border-top:0}
.irow .c-t b{display:block;text-align:right;padding:7px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.irow.venda .c-t .it{width:100%;min-width:0;padding:7px 4px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.irow .c-aj>span{display:flex;align-items:center;gap:5px;position:relative}
.irow .help-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;padding:0;border:1px solid var(--muted);border-radius:50%;background:transparent;color:var(--muted);font:600 10px/1 Arial,sans-serif;cursor:help;flex:0 0 15px}
.irow .help-icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.irow .help-tooltip{display:none;position:absolute;z-index:30;left:calc(100% - 18px);right:auto;top:calc(100% + 5px);width:min(240px,75vw);padding:8px 10px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;font-weight:400;box-shadow:var(--shadow);pointer-events:none}
.irow .help-icon[aria-expanded="true"]+.help-tooltip{display:block}
.irow.venda .c-t{grid-column:7}
.irow.venda .x{grid-column:8}
.irow.venda .c-cost input{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.irow .hint{grid-column:1/-1;font-size:12px;color:var(--muted);min-height:0}
.irow .hint:empty{display:none}
.irow .hint.bad{color:var(--bad)}
.irow .hint.warn{color:var(--warn)}
@media (max-width:640px){
  .irow{grid-template-columns:1fr 1fr 1fr 34px}
  .irow.venda{grid-template-columns:repeat(4,minmax(0,1fr))}
  .irow .c-prod{grid-column:1/4}
  .irow.venda .c-prod{grid-column:1/4}
  .irow .x{grid-column:4;grid-row:1}
  .irow .c-t{grid-column:3;grid-row:2}
  .irow.venda .c-q{grid-column:1;grid-row:2}
  .irow.venda .c-cost{grid-column:2;grid-row:2}
  .irow.venda .c-v{grid-column:3;grid-row:2}
  .irow.venda .c-aj{grid-column:1;grid-row:3}
  .irow.venda .c-ajp{grid-column:2;grid-row:3}
  .irow.venda .c-t{grid-column:3/5;grid-row:3}
  .irow.venda .x{grid-column:4;grid-row:1}
}

  if(t&&t.closest){var formCadChange=t.closest('#cadf');if(formCadChange&&formCadChange.dataset.ent==='produtos'&&['c-custo','c-preco','c-markupPct','c-marginPct'].indexOf(t.id)>=0){atualizarPercentualProduto(t,true);return}}
  if(t.dataset&&t.dataset.f&&t.tagName==='SELECT'){
    F[t.dataset.f]=t.value;
    if(t.dataset.f==='reportSort'||t.dataset.f==='reportPeriod'||t.dataset.f==='reportPayPeriod')renderFull();
    else renderBody();
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,btn=$('button[type=submit]',f);
  var run=f.id==='cadf'?salvarCad:f.id==='inventariof'?salvarInventarioInicial:f.id==='lojaform'?salvarDadosLoja:f.id==='etiquetaf'?imprimirEtiquetas:f.id==='notaf'?salvarNota:f.id==='baixaf'?salvarBaixa:f.id==='editparcf'?salvarParcelaEditada:f.id==='despesaf'?salvarDespesa:f.id==='despesabaixaf'?salvarBaixaDespesa:null;
  if(f.id==='saldo-receberf')run=salvarSaldoReceber;
  if(f.id==='taxasform')run=salvarTaxasCartao;
  if(f.id==='condicionalf')run=salvarCondicional;
  if(f.id==='devolucaocondf')run=salvarDevolucaoCondicional;
  if(!run)return;
  Promise.resolve(run(f)).catch(function(err){if(btn)btn.disabled=false;toast('Não foi possível salvar: '+(err&&err.message||err))});
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  var alvo=e.target,editando=alvo&&(/^(INPUT|TEXTAREA|SELECT)$/.test(alvo.tagName)||alvo.isContentEditable);
  if(!editando&&$('#modal').hidden&&e.key==='F2'){e.preventDefault();if(tab==='vendas')notaForm('venda');else go('vendas');return}
  if(!editando&&$('#modal').hidden&&e.key==='F3'){e.preventDefault();consultaRapidaEstoque();return}
  if(!editando&&$('#modal').hidden&&e.key==='F4'){e.preventDefault();if(tab==='condicionais'){condicionalForm()}else{tab='condicionais';F.q='';renderFull();window.scrollTo(0,0);if(COLS.every(function(c){return loaded[c]}))setTimeout(condicionalForm,0);else abrirCondicionalPendente=true}return}
  if(e.target&&e.target.id==='consulta-estoque-q'&&e.key==='Enter'){e.preventDefault();renderConsultaRapidaEstoque(e.target.value,saldo());return}
  if(e.target&&e.target.matches&&e.target.matches('[data-cond-prod]')&&e.key==='Enter'){e.preventDefault();var pCond=findProd(e.target.value),rowCond=e.target.closest('[data-cond-row]');$('[data-cond-saldo]',rowCond).textContent=pCond?'Disponível: '+fq(saldo()[pCond.id]||0):'Produto não encontrado';$('[data-cond-price]',rowCond).value=pCond?fmtIn(pCond.preco):'';return}
  if(e.target&&e.target.id==='f-scan'&&e.key==='Enter'){e.preventDefault();adicionarProdutoLido();return}
  if(e.target&&e.target.id==='f-scan'&&e.key==='Tab'){e.preventDefault();adicionarProdutoLido(true);return}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('#modal')){
    e.preventDefault();var t=e.target,row=t.closest('[data-row]');
    if(row){
      if(t.classList.contains('ip')){$('.iq',row).focus();$('.iq',row).select()}
      else if(t.classList.contains('iq')){$('.iv',row).focus();$('.iv',row).select()}
      else if(t.classList.contains('iv')){
        var all=$$('#itens [data-row]'),ix=all.indexOf(row);
        if(ix===all.length-1){$('[data-m=addrow]').click()}else{$('.ip',all[ix+1]).focus()}
      }
    }
  }
});

/* ---------- inicialização ---------- */
renderFull();
function semDb(message){
  $('#main').innerHTML='<div class="hero"><h2>Não foi possível abrir o sistema</h2><div class="sub">'+esc(message||'Confira a conexão com o Supabase e tente novamente.')+'</div></div>';
}
function makeId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
}
function formatarDataClima(iso){
  var partes=String(iso||'').split('-');
  if(partes.length!==3)return '';
  var data=new Date(Number(partes[0]),Number(partes[1])-1,Number(partes[2]),12);
  return new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(data).replace('.','');
}
function mostrarClima(dados){
  var resumo=$('#weather-summary'),painel=$('#weather-panel');
  if(!resumo||!painel)return;
  if(!dados||!dados.configured){
    resumo.innerHTML='<span aria-hidden="true">☁</span><span id="weather-summary-text">Configurar clima</span>';
    resumo.setAttribute('aria-label','Previsão do tempo: aguardando configuração');
    painel.innerHTML='<h3>Previsão do tempo</h3><p class="weather-config-help">Para ativar a previsão em Fraiburgo, configure a chave WEATHERAPI_KEY como secret da função weather no Supabase. O passo a passo está no LEIA-ME da migração.</p><p class="weather-credit">Fonte: <a href="https://www.weatherapi.com/" target="_blank" rel="noopener">WeatherAPI.com</a></p>';
    return;
  }
  if(!dados.ok){
    resumo.innerHTML='<span aria-hidden="true">☁</span><span id="weather-summary-text">Clima indisponível</span>';
    resumo.setAttribute('aria-label','Previsão do tempo indisponível');
    painel.innerHTML='<h3>Previsão do tempo</h3><p class="weather-config-help">'+esc(dados.message||'Não foi possível consultar o clima agora.')+' Confira a chave e tente novamente mais tarde.</p><p class="weather-credit">Fonte: <a href="https://www.weatherapi.com/" target="_blank" rel="noopener">WeatherAPI.com</a></p>';
    return;
  }
  var location=[dados.city,dados.region].filter(Boolean).join(', ');
  resumo.innerHTML='<img src="'+esc(dados.icon)+'" alt=""><span class="weather-temp">'+esc(Math.round(Number(dados.tempC)))+'°</span><span>'+esc(dados.city||'Clima')+'</span>';
  resumo.setAttribute('aria-label','Previsão do tempo em '+esc(location)+': '+esc(dados.text)+', '+esc(Math.round(Number(dados.tempC)))+' graus. Abrir detalhes.');
  var dias=(dados.days||[]).map(function(dia,index){
    return '<div class="weather-day"><strong>'+(index===0?'Hoje':esc(formatarDataClima(dia.date)))+'</strong><img src="'+esc(dia.icon)+'" alt="'+esc(dia.text)+'"><strong>'+esc(Math.round(Number(dia.maxC)))+'° / '+esc(Math.round(Number(dia.minC)))+'°</strong><span>Chuva '+esc(dia.rainChance)+'%</span></div>';
  }).join('');
  painel.innerHTML='<h3>Previsão do tempo</h3><div class="weather-location">'+esc(location)+'</div><div class="weather-current"><img src="'+esc(dados.icon)+'" alt=""><div><div class="weather-temp">'+esc(Math.round(Number(dados.tempC)))+'°C</div><div class="weather-condition">'+esc(dados.text)+' · sensação de '+esc(Math.round(Number(dados.feelsLikeC)))+'°C</div></div></div><div class="weather-days">'+dias+'</div><div class="weather-updated">Atualizado em '+esc(dados.updated||'')+'</div><p class="weather-credit">Fonte: <a href="https://www.weatherapi.com/" target="_blank" rel="noopener">WeatherAPI.com</a></p><p class="weather-disclaimer">Previsões são estimativas e podem não refletir as condições exatas. Não use como única base para decisões de segurança ou emergência; consulte os serviços oficiais.</p>';
}
function carregarClima(){
  if(!supabaseClient)return;
  supabaseClient.functions.invoke('weather').then(function(result){if(result.error)throw result.error;mostrarClima(result.data)}).catch(function(){mostrarClima({configured:true,ok:false,message:'Previsão indisponível. Configure a função protegida de clima no Supabase.'})});
}
function listCollection(collection,retries){
  return supabaseClient.from('store_records').select('id,data').eq('store_id',STORE_ID).eq('collection',collection).order('created_at',{ascending:true}).then(function(result){if(result.error)throw result.error;return result.data||[]}).catch(function(err){if(retries>0)return new Promise(function(resolve){setTimeout(resolve,700)}).then(function(){return listCollection(collection,retries-1)});throw new Error('Leitura de “'+collection+'”: '+(err&&err.message||String(err)))})
}
function refreshCollections(names){
  return Promise.all(names.map(function(c){return listCollection(c,1).then(function(rows){S[c]=rows.map(function(row){return Object.assign({},row.data,{id:row.id})});loaded[c]=true;delete loadErrors[c]})})).then(function(){schedule()});
}
function fetchAllCollections(){
  return Promise.all(COLS.map(function(c){return listCollection(c,1).then(function(rows){S[c]=rows.map(function(row){return Object.assign({},row.data,{id:row.id})});loaded[c]=true;delete loadErrors[c]})})).then(function(){delete loadErrors.sistema;schedule()}).catch(function(err){loadErrors.sistema=(err&&err.message)||String(err);schedule()})
}
async function upsertMany(collection,entries){
  if(COLS.indexOf(collection)<0)throw new Error('Área inválida: '+collection);
  var rows=(entries||[]).map(function(item){return {store_id:STORE_ID,collection:collection,id:String(item.id),data:item.data||{}}});
  var result=await supabaseClient.from('store_records').upsert(rows,{onConflict:'store_id,collection,id'}).select('id');
  if(result.error)throw result.error;return {ok:true,count:rows.length};
}
async function registerInitialInventory(payload){
  var result=await supabaseClient.rpc('register_initial_inventory',{p_store_id:STORE_ID,p_date:payload.data,p_items:payload.itens});
  if(result.error)throw result.error;return result.data;
}
function createSupabaseDb(){
  var listeners={};var initialSnapshotReady=false;var channel=null;
  function notify(collection){if(!initialSnapshotReady)return;(listeners[collection]||[]).forEach(function(item){listCollection(collection,1).then(function(rows){item.next({docs:rows.map(function(row){return {id:row.id,data:function(){return row.data}}})})}).catch(item.error)})}
  channel=supabaseClient.channel('store-records-'+STORE_ID).on('postgres_changes',{event:'*',schema:'public',table:'store_records',filter:'store_id=eq.'+STORE_ID},function(event){var row=event.new&&event.new.collection?event.new:event.old;if(row&&row.collection)notify(row.collection)}).subscribe();
  return {collection:function(collection){
    if(COLS.indexOf(collection)<0)throw new Error('Área inválida: '+collection);
    return {doc:function(id){var key=id||makeId();return {
      set:async function(data){var result=await supabaseClient.from('store_records').upsert({store_id:STORE_ID,collection:collection,id:key,data:data||{}},{onConflict:'store_id,collection,id'}).select('id,data').single();if(result.error)throw result.error;notify(collection);var saved=result.data.data||{};return Object.assign({ok:true},saved,{id:result.data.id})},
      update:async function(patch){var result=await supabaseClient.rpc('merge_store_record',{p_store_id:STORE_ID,p_collection:collection,p_id:key,p_patch:patch||{}});if(result.error)throw result.error;notify(collection);return true},
      delete:async function(){var result=await supabaseClient.from('store_records').delete().eq('store_id',STORE_ID).eq('collection',collection).eq('id',key);if(result.error)throw result.error;notify(collection);return true}
    }},onSnapshot:function(next,error){var item={next:next,error:error||function(err){toast('Erro ao ler '+collection+': '+(err&&err.message||err))}};(listeners[collection]||(listeners[collection]=[])).push(item);notify(collection);return {unsubscribe:function(){listeners[collection]=listeners[collection].filter(function(x){return x!==item})}}}}
  },ready:function(){initialSnapshotReady=true;COLS.forEach(notify)}};
}
(function boot(){
  var authScreen=$('#auth-screen'),appShell=$('#app-shell'),authError=$('#auth-error'),authForm=$('#auth-form'),authButton=$('#auth-submit');
  function showAuth(message){appShell.hidden=true;authScreen.hidden=false;if(message)authError.textContent=message}
  async function startApp(){authScreen.hidden=true;appShell.hidden=false;carregarClima();setInterval(carregarClima,30*60*1000);db=createSupabaseDb();COLS.forEach(function(c){db.collection(c).onSnapshot(function(snap){S[c]=snap.docs.map(function(x){return Object.assign({},x.data(),{id:x.id})});loaded[c]=true;delete loadErrors[c];schedule()},function(err){loaded[c]=false;loadErrors[c]=err&&err.message||String(err);schedule()})});await fetchAllCollections();if(db&&db.ready)db.ready()}
  if(SUPABASE_URL.indexOf('COLE_A_')===0||SUPABASE_PUBLISHABLE_KEY.indexOf('COLE_A_')===0){showAuth('Preencha SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY no início do script antes de publicar.');authButton.disabled=true;return}
  if(!window.supabase||!window.supabase.createClient){showAuth('A biblioteca Supabase não carregou. Verifique a conexão e recarregue a página.');return}
  if(!/^[0-9a-f-]{36}$/i.test(STORE_ID)){showAuth('STORE_ID precisa ser o UUID cadastrado na tabela stores.');authButton.disabled=true;return}
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  authForm.addEventListener('submit',async function(event){event.preventDefault();authButton.disabled=true;authError.textContent='';var result=await supabaseClient.auth.signInWithPassword({email:$('#auth-email').value.trim(),password:$('#auth-password').value});if(result.error){authError.textContent=result.error.message;authButton.disabled=false;return}try{await startApp()}catch(err){showAuth(err.message||'Não foi possível carregar a loja.');authButton.disabled=false}});
  $('#supabase-logout').addEventListener('click',async function(){await supabaseClient.auth.signOut();showAuth('Sessão encerrada.')});
  supabaseClient.auth.onAuthStateChange(function(event,session){if(event==='SIGNED_OUT'||!session)showAuth()});
  supabaseClient.auth.getSession().then(function(result){if(result.error){showAuth(result.error.message);return}if(result.data.session)startApp();else showAuth()}).catch(function(err){showAuth(err.message||'Não foi possível verificar a sessão.')});
})();
})();
</script>
